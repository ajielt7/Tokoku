<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title description">
  <title id="title">Konsep Nomor Rumah Akrilik hitam putih</title>
  <desc id="description">Mockup digital papan akrilik hitam ukuran 20 kali 12 sentimeter, orientasi landscape. Angka A01 dan nama area KAMPUNG A berwarna putih sebagai contoh stiker. Ini bukan foto produk asli.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#13231c" flood-opacity="0.2" />
    </filter>
    <linearGradient id="acrylic-edge" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#333a36" />
      <stop offset="1" stop-color="#080a09" />
    </linearGradient>
  </defs>

  <rect width="800" height="520" rx="24" fill="#f2f7f4" />
  <text x="400" y="38" fill="#52645a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2" text-anchor="middle">KONSEP PRODUK · BUKAN FOTO PRODUK</text>

  <g filter="url(#shadow)">
    <rect x="100" y="62" width="600" height="360" rx="12" fill="url(#acrylic-edge)" />
    <rect x="105" y="67" width="590" height="350" rx="9" fill="#151816" />
    <text x="400" y="247" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="700" letter-spacing="3" text-anchor="middle">A01</text>
    <text x="400" y="329" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="600" letter-spacing="2" text-anchor="middle">KAMPUNG A</text>
  </g>

  <text x="400" y="471" fill="#40534a" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle">Contoh teks · Akrilik hitam 3 mm · 20 × 12 cm · Landscape</text>
</svg>
