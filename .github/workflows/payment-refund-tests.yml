name: Payment and refund tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  local-payment-refund-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: node backend/scripts/test-payments.mjs
